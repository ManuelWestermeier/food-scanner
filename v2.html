<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>GTIN Barcode Scanner</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: Arial, sans-serif;
    background: #111;
    color: #eee;
    margin: 0;
    padding: 0;
}

header {
    background: #1e1e1e;
    padding: 10px;
    text-align: center;
    font-size: 18px;
}

#scanner {
    width: 100%;
    height: 60vh;
    background: black;
}

#result {
    padding: 15px;
    background: #1a1a1a;
}

pre {
    white-space: pre-wrap;
    word-break: break-word;
    background: #000;
    padding: 10px;
    border-radius: 4px;
    font-size: 14px;
}

button {
    padding: 10px 15px;
    font-size: 16px;
    background: #2d89ef;
    color: white;
    border: none;
    cursor: pointer;
    border-radius: 4px;
    margin-right: 5px;
}

button:disabled {
    background: #555;
}
</style>
</head>

<body>

<header>
GTIN Barcode Scanner (GTINhub – ohne API-Key)
</header>

<div id="scanner"></div>

<div id="result">
<button id="startBtn">Scanner starten</button>
<button id="stopBtn" disabled>Scanner stoppen</button>

<h3>Ergebnis</h3>
<pre id="output">Noch kein Barcode erkannt.</pre>
</div>

<!-- QuaggaJS -->
<script src="https://unpkg.com/quagga@0.12.1/dist/quagga.min.js"></script>

<script>
const BASE_URL = "https://gtinhub.com/api/v1/product/";
let lastCode = null;

const output = document.getElementById("output");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");

function startScanner() {
    Quagga.init({
        inputStream: {
            name: "Live",
            type: "LiveStream",
            target: document.querySelector("#scanner"),
            constraints: {
                facingMode: "environment"
            }
        },
        decoder: {
            readers: [
                "ean_reader",
                "ean_8_reader",
                "upc_reader",
                "upc_e_reader"
            ]
        }
    }, function (err) {
        if (err) {
            output.textContent = "Scanner-Fehler: " + err;
            return;
        }
        Quagga.start();
        startBtn.disabled = true;
        stopBtn.disabled = false;
    });

    Quagga.onDetected(onDetected);
}

function stopScanner() {
    Quagga.stop();
    startBtn.disabled = false;
    stopBtn.disabled = true;
}

async function onDetected(result) {
    const code = result.codeResult.code;

    if (code === lastCode) return;
    lastCode = code;

    output.textContent =
        "Barcode erkannt: " + code + "\n\nLade Produktdaten...";

    try {
        const response = await fetch(BASE_URL + encodeURIComponent(code));

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const data = await response.json();
        output.textContent = JSON.stringify(data, null, 2);
    } catch (err) {
        output.textContent =
            "Fehler beim Abrufen der Produktdaten:\n" + err.message;
    }
}

startBtn.addEventListener("click", startScanner);
stopBtn.addEventListener("click", stopScanner);
</script>

</body>
</html>
