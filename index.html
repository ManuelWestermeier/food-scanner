<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Food Barcode Scanner</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: #0f172a;
  color: #e5e7eb;
}
.app {
  max-width: 900px;
  margin: auto;
  padding: 16px;
}
h1 { font-size: 18px; margin-bottom: 8px; }
video {
  width: 100%;
  border-radius: 10px;
  background: black;
}
button, input {
  padding: 8px 10px;
  border-radius: 8px;
  border: none;
  font-size: 14px;
}
button {
  background: #06b6d4;
  color: #022c22;
  font-weight: 700;
  cursor: pointer;
}
input {
  background: #020617;
  color: white;
  border: 1px solid #1e293b;
}
.controls {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 10px 0;
}
.card {
  background: #020617;
  border-radius: 12px;
  padding: 12px;
  margin-top: 12px;
}
img {
  max-width: 100%;
  max-height: 220px;
  object-fit: contain;
  background: #020617;
  border-radius: 10px;
}
.badges span {
  display: inline-block;
  padding: 6px 8px;
  border-radius: 8px;
  background: #020617;
  margin-right: 6px;
  margin-top: 6px;
  font-weight: 700;
}
.kv {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 10px;
}
.kv div {
  background: #020617;
  padding: 8px;
  border-radius: 8px;
  font-size: 13px;
}
.status {
  font-size: 13px;
  color: #94a3b8;
  margin-top: 6px;
}
</style>
</head>

<body>
<div class="app">
  <h1>Barcode Scanner – Open Food Facts</h1>

  <video id="video" autoplay playsinline muted></video>

  <div class="controls">
    <button onclick="startScan()">Start scan</button>
    <button onclick="stopScan()">Stop</button>
    <input id="manual" placeholder="Enter barcode">
    <button onclick="manualLookup()">Lookup</button>
  </div>

  <div id="status" class="status">Ready.</div>

  <div id="result" class="card" style="display:none">
    <img id="img">
    <h2 id="title"></h2>
    <div class="badges" id="badges"></div>

    <div class="kv" id="kv"></div>

    <p id="ingredients"></p>
    <p id="allergens"></p>

    <a id="link" target="_blank" style="color:#06b6d4;font-weight:700">
      Open on Open Food Facts
    </a>
  </div>
</div>

<script>
let stream;
let detector;
let scanning = false;

async function startScan() {
  if (!("BarcodeDetector" in window)) {
    setStatus("BarcodeDetector API not supported. Use manual input.");
    return;
  }

  detector = new BarcodeDetector({
    formats: ["ean_13", "ean_8", "upc_a", "upc_e"]
  });

  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "environment" }
  });

  video.srcObject = stream;
  scanning = true;
  scanLoop();
  setStatus("Scanning…");
}

function stopScan() {
  scanning = false;
  if (stream) stream.getTracks().forEach(t => t.stop());
  setStatus("Stopped.");
}

async function scanLoop() {
  if (!scanning) return;

  try {
    const codes = await detector.detect(video);
    if (codes.length) {
      scanning = false;
      stopScan();
      lookup(codes[0].rawValue);
    }
  } catch (_) {}

  requestAnimationFrame(scanLoop);
}

function manualLookup() {
  const code = manual.value.trim();
  if (code) lookup(code);
}

async function lookup(barcode) {
  setStatus("Fetching product " + barcode);
  const res = await fetch(
    `https://world.openfoodfacts.org/api/v0/product/${barcode}.json`
  );
  const data = await res.json();
  if (data.status !== 1) {
    setStatus("Product not found");
    return;
  }
  render(data.product, barcode);
}

function render(p, barcode) {
  result.style.display = "block";
  img.src = p.image_front_url || "";
  title.textContent = p.product_name || "Unknown product";

  badges.innerHTML = "";
  addBadge("Nutri-Score", p.nutrition_grade_fr);
  addBadge("Eco-Score", p.ecoscore_grade);
  addBadge("NOVA", p.nova_group);

  kv.innerHTML = "";
  addKV("Brand", p.brands);
  addKV("Quantity", p.quantity);
  addKV("Energy kcal/100g", p.nutriments?.["energy-kcal_100g"]);
  addKV("Sugars g/100g", p.nutriments?.["sugars_100g"]);
  addKV("Fat g/100g", p.nutriments?.["fat_100g"]);
  addKV("Salt g/100g", p.nutriments?.["salt_100g"]);

  ingredients.textContent = p.ingredients_text || "";
  allergens.textContent = p.allergens ? "Allergens: " + p.allergens : "";
  link.href = p.url || `https://world.openfoodfacts.org/product/${barcode}`;
  setStatus("Loaded.");
}

function addBadge(label, value) {
  if (!value) return;
  const s = document.createElement("span");
  s.textContent = `${label}: ${String(value).toUpperCase()}`;
  badges.appendChild(s);
}

function addKV(k, v) {
  const d = document.createElement("div");
  d.innerHTML = `<b>${k}</b><br>${v ?? "—"}`;
  kv.appendChild(d);
}

function setStatus(t) {
  status.textContent = t;
}
</script>
</body>
</html>
